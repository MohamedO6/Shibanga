name: Verify Fringe
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-and-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node --test tests/*.test.mjs
      - run: python Tools/audit_web.py --check
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r pipeline/test-requirements.txt
      - run: python pipeline/tests/test_pipeline.py
